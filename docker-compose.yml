version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agritrace-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=AgriTrace2026Secure
      - POSTGRES_DB=agritrace_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agritrace-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agritrace-backend
    restart: always
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:AgriTrace2026Secure@postgres:5432/agritrace_db
      - RPC_URL=https://polygon-amoy-bor-rpc.publicnode.com
      - CONTRACT_ADDRESS=0x68Af0988167fddD7Eb5CE70485EA41f3A4a582a6
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - agritrace-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_CONTRACT_ADDRESS=0x68Af0988167fddD7Eb5CE70485EA41f3A4a582a6
        - NEXT_PUBLIC_RPC_URL=https://polygon-amoy-bor-rpc.publicnode.com
    container_name: agritrace-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - agritrace-net

  nginx:
    image: nginx:alpine
    container_name: agritrace-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agritrace-net

volumes:
  postgres_data:
  backend_uploads:

networks:
  agritrace-net:
    driver: bridge
