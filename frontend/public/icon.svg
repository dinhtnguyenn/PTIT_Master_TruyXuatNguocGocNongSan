<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="agriGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7" fill="url(#agriGradient)" />

  <!-- Subtle shield background fill -->
  <path d="M16 6.5 L23.5 9.5 V15.5 C23.5 20.5 19.5 24.5 16 26 C12.5 24.5 8.5 20.5 8.5 15.5 V9.5 Z" fill="#047857" opacity="0.35"/>

  <!-- Shield outline -->
  <path d="M16 6.5 L23.5 9.5 V15.5 C23.5 20.5 19.5 24.5 16 26 C12.5 24.5 8.5 20.5 8.5 15.5 V9.5 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark -->
  <path d="M12.5 16 L15 18.5 L20 13.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
